<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Macro Example</title>
    {% include (www/style.html) %}
</head>
<body>

{% if ($params/rows == 0) %}
    Navigate to /show/{someNumber} to see something cool.<br />
    Try something like <a href="show/15">http://localhost:8080/show/15</a>
{% else %}

    {% macro blocks from (www/macros.html) %}

    {% for (row = 0 to $params/rows) %}
    {{ blocks($row) }}
    {% end_for %}

{% end_if %}

</body>
</html>
